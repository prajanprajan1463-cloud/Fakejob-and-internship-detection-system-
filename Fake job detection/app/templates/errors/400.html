{% extends "base.html" %}
{% block title %}400 Bad Request - Fake Job Detection{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="saas-card mx-auto p-5" style="max-width: 550px;">
        <div class="empty-state-icon text-warning mb-3">
            <i class="bi bi-exclamation-triangle fs-1"></i>
        </div>
        <h2 class="h3 fw-bold mb-2">400 - Bad Request</h2>
        <p class="text-muted mb-4">The request could not be processed due to invalid parameters or formatting.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-saas-primary">
            <i class="bi bi-house me-1"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
