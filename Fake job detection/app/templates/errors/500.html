{% extends "base.html" %}
{% block title %}500 Internal Error - Fake Job Detection{% endblock %}
{% block content %}
<div class="container py-5 text-center">
    <div class="saas-card mx-auto p-5" style="max-width: 550px;">
        <div class="empty-state-icon text-danger mb-3">
            <i class="bi bi-cpu fs-1"></i>
        </div>
        <h2 class="h3 fw-bold mb-2">500 - Internal Server Error</h2>
        <p class="text-muted mb-4">An unexpected server error occurred. Our team has logged the issue and is reviewing it.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-saas-primary">
            <i class="bi bi-house me-1"></i> Return Home
        </a>
    </div>
</div>
{% endblock %}
